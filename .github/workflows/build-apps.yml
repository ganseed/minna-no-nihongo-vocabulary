name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows app
        shell: pwsh
        run: ./build_windows_app.ps1
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "dist/windows/*" -DestinationPath "dist/大家的日语词库-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/大家的日语词库-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS app
        run: chmod +x build_macos_app.sh && ./build_macos_app.sh
      - name: Package macOS app
        run: cd dist/macos && ditto -c -k --sequesterRsrc . ../大家的日语词库-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/大家的日语词库-macOS.zip
