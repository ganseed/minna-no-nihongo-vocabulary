name: Build macOS app

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build macOS application
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh

      - name: Test bundled application generation
        run: |
          package="dist/macos/大家的日语词库-macOS"
          standalone="$RUNNER_TEMP/vocabulary-standalone"
          mkdir -p "$standalone"
          ditto "$package/大家的日语词库工具.app" "$standalone/大家的日语词库工具.app"
          "$standalone/大家的日语词库工具.app/Contents/MacOS/大家的日语词库工具" --generate-excel-and-exit --output "$package/output"
          python3 -c "from pathlib import Path; from openpyxl import load_workbook; p=Path('$package')/'output'/'大家的日语Ⅰ默写.xlsx'; assert p.is_file(), 'Bundled generation failed'; assert load_workbook(p)['默写'].max_row == 21, 'Unexpected blank question rows'"

      - name: Verify release contents
        run: |
          package="dist/macos/大家的日语词库-macOS"
          test -d "$package/大家的日语词库工具.app"
          test -f "$package/data/vocabulary.json"
          test -f "$package/template/默写宏模板.xlsm"
          test -f "$package/output/大家的日语Ⅰ默写-宏版.xlsm"

      - name: Create macOS zip
        run: |
          cd dist/macos
          ditto -c -k --sequesterRsrc --keepParent "大家的日语词库-macOS" "../minna-no-nihongo-vocabulary-macOS.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: minna-no-nihongo-vocabulary-macos
          path: dist/minna-no-nihongo-vocabulary-macOS.zip
          if-no-files-found: error
          retention-days: 14
