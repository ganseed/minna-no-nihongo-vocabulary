name: Publish Windows and macOS release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    if: startsWith(github.event.head_commit.message, 'Publish Windows and macOS packages together')
    uses: ./.github/workflows/test.yml

  windows:
    if: startsWith(github.event.head_commit.message, 'Publish Windows and macOS packages together')
    needs: test
    uses: ./.github/workflows/build-windows.yml

  macos:
    if: startsWith(github.event.head_commit.message, 'Publish Windows and macOS packages together')
    needs: test
    uses: ./.github/workflows/build-macos.yml

  publish:
    if: startsWith(github.event.head_commit.message, 'Publish Windows and macOS packages together')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows and macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: minna-no-nihongo-vocabulary-*
          path: release-assets
          merge-multiple: true

      - name: Verify both packages exist
        run: |
          test -f release-assets/minna-no-nihongo-vocabulary-Windows.zip
          test -f release-assets/minna-no-nihongo-vocabulary-macOS.zip

      - name: Publish both platform packages to Release 1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.1"
          name: "1.1"
          body: |
            ## 修复内容

            - 修复 macOS 应用在 Gatekeeper App Translocation 路径下无法写入输出文件的问题。
            - 将词库和宏版 Excel 模板显式打包进 macOS 应用，避免出现“缺少宏模板”。
            - 增加 macOS 应用搬移后的实际生成测试。
            - 同时提供 Windows 与 macOS 两个平台的安装包。

            ## 下载

            - Windows：下载 Windows ZIP 并解压运行。
            - macOS：下载 macOS ZIP，解压后运行「大家的日语词库工具.app」。
          files: |
            release-assets/minna-no-nihongo-vocabulary-Windows.zip
            release-assets/minna-no-nihongo-vocabulary-macOS.zip
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
