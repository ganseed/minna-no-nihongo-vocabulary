name: Publish macOS release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'Publish v1.1')
    uses: ./.github/workflows/build-macos.yml

  publish:
    if: startsWith(github.event.head_commit.message, 'Publish v1.1')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download verified macOS package
        uses: actions/download-artifact@v4
        with:
          name: minna-no-nihongo-vocabulary-macos
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.1"
          name: "1.1"
          body: |
            ## 修复内容

            - 修复 macOS 应用在 Gatekeeper App Translocation 路径下无法写入输出文件的问题。
            - 将词库和宏版 Excel 模板显式打包进 .app/Contents/Resources，避免出现“缺少宏模板”。
            - 增加应用搬移后的实际生成测试，验证普通版与宏版 Excel 均可生成。

            ## 下载

            下载 macOS ZIP，解压后运行「大家的日语词库工具.app」。
          files: release-assets/minna-no-nihongo-vocabulary-macOS.zip
          draft: false
          prerelease: false
          make_latest: true
