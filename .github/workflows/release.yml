name: Release Windows and macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
  windows:
    needs: test
    uses: ./.github/workflows/build-windows.yml
  macos:
    needs: test
    uses: ./.github/workflows/build-macos.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minna-no-nihongo-vocabulary-*
          path: release-assets
          merge-multiple: true
      - name: Publish both platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          test -f 'release-assets/大家的日语词库-Windows.zip'
          test -f 'release-assets/大家的日语词库-macOS.zip'
          gh release create "$TAG" --verify-tag --title "${TAG} 默写体验优化" \
            --notes-file RELEASE_NOTES.md release-assets/*.zip
